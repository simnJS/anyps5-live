<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, height=720">
  <title>Leonida live thumbnail</title>
  <style>
    html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #0d0d0d; color: #f0efec; font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    body { background: radial-gradient(ellipse 70% 80% at 85% 20%, rgba(255, 79, 163, 0.45), transparent 65%), radial-gradient(ellipse 60% 70% at 100% 100%, rgba(255, 154, 60, 0.35), transparent 60%), radial-gradient(ellipse 60% 60% at 0% 100%, rgba(139, 92, 246, 0.35), transparent 60%), #0d0d0d; }
    .logo { position: absolute; right: 40px; top: 70px; width: 470px; filter: drop-shadow(0 20px 60px rgba(255, 79, 163, 0.55)); }
    .text { position: absolute; left: 64px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
    .live { display: inline-flex; align-items: center; gap: 12px; background: #d03b3b; color: #fff; font-size: 34px; font-weight: 900; letter-spacing: 0.06em; padding: 10px 22px 10px 18px; border-radius: 10px; }
    .live i { width: 16px; height: 16px; border-radius: 50%; background: #fff; }
    h1 { margin: 20px 0 0; font-size: 200px; font-weight: 900; letter-spacing: -0.05em; line-height: 0.85; text-shadow: 0 8px 40px rgba(0, 0, 0, 0.6); }
    .pc { margin-top: 6px; font-size: 118px; font-weight: 900; letter-spacing: -0.03em; line-height: 1; background: linear-gradient(100deg, #8b5cf6, #ff4fa3 50%, #ff9a3c); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .stars { margin-top: 22px; padding: 10px 22px; border-radius: 14px; background: rgba(0, 0, 0, 0.55); font-size: 44px; font-weight: 900; }
    .stars span { color: #ffd166; }
  </style>
</head>
<body>
  <img class="logo" src="leonida-logo.png" alt="">
  <div class="text">
    <div class="live"><i></i>LIVE 24/7</div>
    <h1>GTA VI</h1>
    <div class="pc">ON PC?</div>
    <div class="stars"><span id="stars">23K</span> ⭐ in <span id="days">3 days</span></div>
  </div>
  <script>
    fetch("/api/state", { cache: "no-store" })
      .then((response) => response.json())
      .then((state) => {
        const leonida = state.leonida;
        if (leonida?.stars) document.getElementById("stars").textContent = `${Math.floor(leonida.stars / 1000)}K`;
        if (leonida?.createdAt) {
          const days = Math.max(1, Math.round((Date.now() - Date.parse(leonida.createdAt)) / 86_400_000));
          document.getElementById("days").textContent = `${days} day${days > 1 ? "s" : ""}`;
        }
        document.body.dataset.ready = "true";
      });
  </script>
</body>
</html>
