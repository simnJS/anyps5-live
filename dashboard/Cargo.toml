[package]
name = "anyps5-live-dashboard"
version = "1.0.0"
edition = "2024"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
http = "1"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14.9", features = ["tls-webpki-roots"] }
tonic-prost = "0.14.9"
tower-http = { version = "0.6", features = ["fs"] }
