name: anyps5-live

services:
  dashboard:
    build: ./dashboard
    restart: unless-stopped
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_VIDEO_ID: ${YOUTUBE_VIDEO_ID:-}
      CHAT_COMMANDS: ${CHAT_COMMANDS:-0}
      CHAT_POLL_SECONDS: ${CHAT_POLL_SECONDS:-75}
      CHAT_BURST_MINUTES: ${CHAT_BURST_MINUTES:-3}
      CHAT_DAILY_UNITS: ${CHAT_DAILY_UNITS:-8000}
      CHAT_REMINDER_MINUTES: ${CHAT_REMINDER_MINUTES:-60}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      SHORT_PRIVACY: ${SHORT_PRIVACY:-public}
    volumes:
      - dashboard-data:/data
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:8080"

  streamer:
    build: ./streamer
    restart: unless-stopped
    depends_on:
      dashboard:
        condition: service_healthy
    environment:
      YOUTUBE_STREAM_KEY: ${YOUTUBE_STREAM_KEY:-}
      YOUTUBE_RTMP_URL: ${YOUTUBE_RTMP_URL:-rtmp://a.rtmp.youtube.com/live2}
      OUTPUT: ${OUTPUT:-}
      RECORD_SECONDS: ${RECORD_SECONDS:-}
      WIDTH: ${WIDTH:-2560}
      HEIGHT: ${HEIGHT:-1440}
      FPS: ${FPS:-30}
      CAPTURE_FPS: ${CAPTURE_FPS:-30}
      VIDEO_BITRATE: ${VIDEO_BITRATE:-12000k}
      BUFSIZE: ${BUFSIZE:-24000k}
      AUDIO_BITRATE: ${AUDIO_BITRATE:-128k}
      PRESET: ${PRESET:-superfast}
      TZ: ${TZ:-Europe/Paris}
      SHORTS: ${SHORTS:-1}
      SHORT_HOUR_UTC: ${SHORT_HOUR_UTC:-18}
      WARMUP_SECONDS: ${WARMUP_SECONDS:-15}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
    shm_size: 1gb
    volumes:
      - ./music:/music:ro
      - ./recordings:/recordings

volumes:
  dashboard-data:
