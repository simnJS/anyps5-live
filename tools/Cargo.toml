[package]
name = "anyps5-youtube-auth"
version = "1.0.0"
edition = "2024"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "io-util", "rt-multi-thread"] }
url = "2"
